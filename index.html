<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTools Gamer</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 50px;
    background: #0b1120;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
  }

  .topo {
    max-width: 760px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 22px;
    border-radius: 14px;
    background: linear-gradient(135deg, #22d3ee, #8b5cf6);
  }

  h1 { margin: 0; font-size: 22px; }
  h1 span { color: #22d3ee; }

  .subtitulo {
    color: #94a3b8;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .card {
    max-width: 760px;
    margin: 0 auto;
    padding: 18px;
    border-radius: 18px;
    background: #111827;
    border: 1px solid #1f2937;
  }

  .status {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .verde { color: #34d399; }
  .vermelho { color: #fb7185; }

  .info {
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 16px;
    word-break: break-word;
  }

  .info strong { color: #e2e8f0; }

  .erro {
    display: none;
    margin-bottom: 14px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(251,113,133,.12);
    border: 1px solid #fb7185;
    color: #fecdd3;
    font-family: monospace;
    white-space: pre-wrap;
  }

  .painel { display: none; }

  .metricas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .metrica {
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    background: #0b1220;
  }

  .metrica-valor {
    font-size: 16px;
    font-weight: bold;
    color: #22d3ee;
  }

  .metrica-rotulo {
    margin-top: 3px;
    color: #94a3b8;
    font-size: 9px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .controle {
    padding: 16px;
    border-radius: 16px;
    background: #0b1220;
    border: 1px solid #1f2937;
  }

  .modelo {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .gamepad {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    aspect-ratio: 2.1 / 1;
  }

  .corpo {
    position: absolute;
    inset: 12% 6%;
    border-radius: 70px;
    background: linear-gradient(160deg, #1e293b, #0f172a);
    border: 1px solid #334155;
    box-shadow: inset 0 0 30px rgba(0,0,0,.4);
  }

  .parte {
    position: absolute;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 10px;
    font-weight: bold;
    transition: .07s;
  }

  .parte.on {
    color: #fff;
    border-color: #22d3ee;
    background: rgba(34,211,238,.22);
    box-shadow: 0 0 14px rgba(34,211,238,.35);
    transform: scale(.94);
  }

  .face-a { right: 20%; top: 54%; width: 13%; aspect-ratio: 1; }
  .face-b { right: 28%; top: 40%; width: 13%; aspect-ratio: 1; }
  .face-x { right: 28%; top: 68%; width: 13%; aspect-ratio: 1; }
  .face-y { right: 36%; top: 54%; width: 13%; aspect-ratio: 1; }

  .dpad {
    left: 20%;
    top: 54%;
    width: 34%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0;
    background: transparent;
  }

  .dpad div {
    position: absolute;
    width: 32%;
    height: 32%;
    display: grid;
    place-items: center;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 9px;
    font-weight: bold;
    transition: .07s;
  }

  .dpad div.on {
    color: #fff;
    border-color: #22d3ee;
    background: rgba(34,211,238,.22);
    box-shadow: 0 0 12px rgba(34,211,238,.3);
  }

  .dpad .cima { left: 34%; top: 0; }
  .dpad .baixo { left: 34%; bottom: 0; }
  .dpad .esquerda { left: 0; top: 34%; }
  .dpad .direita { right: 0; top: 34%; }

  .stick {
    position: absolute;
    width: 15%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #0f172a;
    display: grid;
    place-items: center;
  }

  .stick-dot {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: linear-gradient(135deg, #22d3ee, #818cf8);
    transition: transform .04s linear;
  }

  .stick-esquerdo { left: 24%; top: 54%; transform: translate(-50%, -50%); }
  .stick-direito { right: 24%; top: 54%; transform: translate(50%, -50%); }

  .ombro {
    position: absolute;
    top: 16%;
    width: 15%;
    height: 10%;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 9px;
    font-weight: bold;
    display: grid;
    place-items: center;
    transition: .07s;
  }

  .ombro.on {
    color: #fff;
    border-color: #22d3ee;
    background: rgba(34,211,238,.22);
    box-shadow: 0 0 12px rgba(34,211,238,.3);
  }

  .ombro-esquerdo { left: 24%; transform: translateX(-50%); }
  .ombro-direito { right: 24%; transform: translateX(50%); }

  .gatilho {
    position: absolute;
    top: 4%;
    width: 15%;
    height: 10%;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 9px;
    font-weight: bold;
    display: grid;
    place-items: center;
    transition: .07s;
  }

  .gatilho.on {
    color: #fff;
    border-color: #a855f7;
    background: rgba(168,85,247,.22);
    box-shadow: 0 0 12px rgba(168,85,247,.3);
  }

  .gatilho-esquerdo { left: 24%; transform: translateX(-50%); }
  .gatilho-direito { right: 24%; transform: translateX(50%); }

  .centro {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    display: grid;
    gap: 6px;
    justify-items: center;
    color: #94a3b8;
    font-size: 8px;
    font-weight: bold;
    text-transform: uppercase;
    text-align: center;
  }

  .centro-logo {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #0f172a;
    font-size: 14px;
  }

  .botoes-centrais {
    display: flex;
    gap: 5px;
  }

  .botao-central {
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 6px;
    font-weight: bold;
    transition: .07s;
  }

  .botao-central.on {
    color: #fff;
    border-color: #22d3ee;
    background: rgba(34,211,238,.22);
    box-shadow: 0 0 10px rgba(34,211,238,.3);
  }

  .home {
    position: absolute;
    left: 50%;
    top: 78%;
    transform: translate(-50%, -50%);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    font-size: 10px;
    transition: .07s;
  }

  .home.on {
    color: #fff;
    border-color: #22d3ee;
    background: rgba(34,211,238,.22);
    box-shadow: 0 0 10px rgba(34,211,238,.3);
  }

  .bloco {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #1f2937;
    background: #0b1220;
  }

  .bloco-titulo {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    color: #94a3b8;
    font-size: 9px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
  }

  .botao {
    min-height: 44px;
    display: grid;
    align-content: center;
    gap: 3px;
    padding: 6px;
    border-radius: 10px;
    border: 1px solid #1f2937;
    background: #0f172a;
    color: #94a3b8;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
  }

  .botao span {
    font-size: 9px;
    color: #22d3ee;
  }

  .eixos {
    display: grid;
    gap: 8px;
  }

  .eixo {
    display: grid;
    grid-template-columns: 60px 1fr 40px;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    font-size: 10px;
  }

  .medidor {
    height: 7px;
    border-radius: 999px;
    background: #060b13;
    border: 1px solid #1f2937;
    overflow: hidden;
  }

  .medidor-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #22d3ee, #818cf8);
  }

  .valor {
    text-align: right;
    color: #cbd5e1;
  }

  .vibracao {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  input[type="range"] {
    flex: 1;
    min-width: 120px;
    accent-color: #22d3ee;
  }

  button {
    padding: 10px 14px;
    border: 0;
    border-radius: 10px;
    background: #22d3ee;
    color: #04121a;
    font-weight: bold;
    cursor: pointer;
  }

  footer {
    max-width: 760px;
    margin: 20px auto 0;
    color: #94a3b8;
    font-size: 11px;
    text-align: center;
  }

  footer strong { color: #e2e8f0; }

  @media (max-width: 600px) {
    .gamepad { aspect-ratio: 1.7 / 1; }
  }
</style>
</head>
