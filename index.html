<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTools Gamer — Testador de Controles USB</title>

<style>
  :root {
    --fundo: #05070d;
    --card: #101826;
    --card2: #0b1220;
    --borda: #26313d;
    --texto: #eef2ff;
    --cinza: #94a3b8;
    --ciano: #22d3ee;
    --violeta: #a855f7;
    --verde: #34d399;
    --vermelho: #fb7185;
    --amarelo: #fbbf24;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px 60px;
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(800px 500px at 92% 0%, rgba(168,85,247,.16), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(52,211,153,.08), transparent 65%),
      var(--fundo);
    color: var(--texto);
    font-family: Arial, sans-serif;
  }

  .topo {
    max-width: 1080px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    font-size: 28px;
    border-radius: 17px;
    background: linear-gradient(135deg, var(--ciano), var(--violeta));
    box-shadow: 0 12px 32px rgba(34,211,238,.25);
  }

  h1 {
    margin: 0;
    font-size: 30px;
  }

  h1 span {
    color: var(--ciano);
  }

  .subtitulo {
    color: var(--cinza);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 5px;
  }

  .hero {
    max-width: 1080px;
    margin: 0 auto 28px;
    text-align: center;
  }

  .selo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid rgba(34,211,238,.3);
    background: rgba(34,211,238,.08);
    color: #a5f3fc;
    font-size: 12px;
    font-weight: bold;
  }

  .selo span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--verde);
  }

  .hero h2 {
    max-width: 760px;
    margin: 18px auto 12px;
    font-size: clamp(30px, 5vw, 50px);
    line-height: 1.1;
  }

  .hero h2 em {
    color: var(--ciano);
    font-style: normal;
  }

  .hero p {
    max-width: 640px;
    margin: 0 auto;
    color: var(--cinza);
    font-size: 16px;
    line-height: 1.65;
  }

  .recursos {
    max-width: 1080px;
    margin: 0 auto 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  .recurso {
    padding: 18px;
    border-radius: 16px;
    border: 1px solid var(--borda);
    background: rgba(16,24,38,.75);
  }

  .recurso strong {
    display: block;
    margin-bottom: 6px;
    font-size: 15px;
  }

  .recurso p {
    margin: 0;
    color: var(--cinza);
    font-size: 13px;
    line-height: 1.55;
  }

  .card {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--borda);
    box-shadow: 0 25px 70px rgba(0,0,0,.4);
  }

  .status {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .verde { color: var(--verde); }
  .vermelho { color: var(--vermelho); }

  .info {
    color: var(--cinza);
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 22px;
    word-break: break-word;
  }

  .info strong {
    color: var(--texto);
  }

  .erro {
    display: none;
    margin-bottom: 20px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(251,113,133,.14);
    border: 1px solid var(--vermelho);
    color: #fecdd3;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
  }

  .painel {
    display: none;
  }

  .grade-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .caixa {
    padding: 16px;
    border-radius: 16px;
    border: 1px solid var(--borda);
    background: var(--card2);
  }

  .caixa-valor {
    font-size: 24px;
    font-weight: bold;
    color: var(--ciano);
  }

  .caixa-rotulo {
    margin-top: 4px;
    color: var(--cinza);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .8px;
    text-transform: uppercase;
  }

  .controle {
    padding: 28px;
    border-radius: 24px;
    background: var(--card2);
    border: 1px solid var(--borda);
  }

  .ombros {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 26px;
  }

  .lado {
    flex: 1;
    display: grid;
    gap: 10px;
  }

  .ombro {
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--borda);
    background: #131c2b;
    color: var(--cinza);
    font-size: 12px;
    font-weight: bold;
  }

  .corpo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .grupo {
    display: grid;
    gap: 20px;
    justify-items: center;
  }

  .dpad {
    width: 140px;
    height: 140px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
  }

  .dpad div {
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background: #131c2b;
    color: var(--cinza);
    font-size: 15px;
    font-weight: bold;
  }

  .dpad .cima { grid-area: 1 / 2; }
  .dpad .esquerda { grid-area: 2 / 1; }
  .dpad .direita { grid-area: 2 / 3; }
  .dpad .baixo { grid-area: 3 / 2; }

  .stick {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: #131c2b;
    display: grid;
    place-items: center;
    position: relative;
  }

  .stick-rotulo {
    position: absolute;
    bottom: 7px;
    color: var(--cinza);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: .6px;
  }

  .stick-dot {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ciano), #818cf8);
    box-shadow: 0 0 20px rgba(34,211,238,.35);
    transition: transform .04s linear;
  }

  .centro {
    display: grid;
    place-items: center;
    gap: 12px;
    color: var(--cinza);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: center;
  }

  .centro-logo {
    width: 80px;
    height: 80px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: #131c2b;
    font-size: 28px;
  }

  .botoes-centrais {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .botao-central {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: #131c2b;
    color: var(--cinza);
    font-size: 9px;
    font-weight: bold;
    text-align: center;
  }

  .face {
    display: grid;
    grid-template-columns: repeat(2, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 10px;
    justify-items: center;
    align-items: center;
  }

  .face div {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: #131c2b;
    color: var(--cinza);
    font-size: 18px;
    font-weight: bold;
  }

  .face .cima { grid-area: 1 / 2; }
  .face .esquerda { grid-area: 2 / 1; }
  .face .baixo { grid-area: 2 / 1; }
  .face .direita { grid-area: 2 / 2; }

  .ativo {
    background: rgba(34,211,238,.25) !important;
    border-color: var(--ciano) !important;
    color: #ffffff !important;
    box-shadow: 0 0 20px rgba(34,211,238,.4);
  }

  .bloco {
    margin-top: 22px;
    padding: 18px;
    border-radius: 18px;
    border: 1px solid var(--borda);
    background: var(--card2);
  }

  .bloco-titulo {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    color: var(--cinza);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 8px;
  }

  .botao {
    min-height: 58px;
    display: grid;
    align-content: center;
    gap: 4px;
    padding: 8px;
    border-radius: 11px;
    border: 1px solid var(--borda);
    background: #131c2b;
    color: var(--cinza);
    font-size: 11px;
    font-weight: bold;
    text-align: center;
  }

  .botao span {
    font-size: 10px;
    color: var(--ciano);
  }

  .eixos {
    display: grid;
    gap: 12px;
  }

  .eixo {
    display: grid;
    grid-template-columns: 86px 1fr 54px;
    align-items: center;
    gap: 10px;
    color: var(--cinza);
    font-size: 12px;
  }

  .medidor {
    height: 10px;
    border-radius: 999px;
    background: #060b13;
    border: 1px solid var(--borda);
    overflow: hidden;
  }

  .medidor-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, var(--ciano), #818cf8);
  }

  .valor {
    text-align: right;
    color: #cbd5e1;
  }

  .vibracao {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  input[type="range"] {
    flex: 1;
    min-width: 160px;
    accent-color: var(--ciano);
  }

  button {
    padding: 13px 20px;
    border: 0;
    border-radius: 11px;
    background: var(--ciano);
    color: #04121a;
    font-weight: bold;
    cursor: pointer;
  }

  .aviso {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(251,191,36,.3);
    background: rgba(251,191,36,.08);
    color: #fde68a;
    font-size: 13px;
    line-height: 1.55;
  }

  footer {
    max-width: 1080px;
    margin: 30px auto 0;
    color: var(--cinza);
    font-size: 13px;
    text-align: center;
  }

  footer strong {
    color: var(--texto);
  }

  @media (max-width: 760px) {
    .corpo {
      flex-direction: col
