<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTools Gamer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #070b12;
      color: #eef2ff;
      font-family: system-ui, sans-serif;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #22d3ee, #a855f7);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h1 span {
      color: #22d3ee;
    }

    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #101826;
      border: 1px solid #26313d;
      border-radius: 18px;
      padding: 22px;
    }

    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ok { color: #34d399; }
    .erro { color: #fb7185; }

    .info {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .error {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(251, 113, 133, .12);
      border: 1px solid rgba(251, 113, 133, .4);
      color: #fecdd3;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .gamepad {
      display: none;
      max-width: 620px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 20px;
      background: #0b1220;
      border: 1px solid #26313d;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .side {
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .dpad {
      width: 130px;
      height: 130px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }

    .dpad div {
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid #26313d;
      background: #131c2b;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 700;
    }

    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }

    .on {
      background: rgba(34, 211, 238, .25) !important;
      border-color: #22d3ee !important;
      color: #fff !important;
      box-shadow: 0 0 18px rgba(34, 211, 238, .35);
    }

    .stick {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1px solid #26313d;
      background: #131c2b;
      display: grid;
      place-items: center;
    }

    .stick-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      transition: transform .04s linear;
    }

    .center {
      display: grid;
      place-items: center;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .face {
      display: grid;
      grid-template-columns: repeat(2, 54px);
      grid-template-rows: repeat(2, 54px);
      gap: 10px;
      justify-items: center;
      align-items: center;
    }

    .face div {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid #26313d;
      background: #131c2b;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 800;
    }

    .face .top { grid-area: 1 / 2; }
    .face .left { grid-area: 2 / 1; }
    .face .right { grid-area: 2 / 2; }
    .face .bottom { grid-area: 2 / 1; }

    .shoulders {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .shoulder {
      flex: 1;
      display: grid;
      gap: 8px;
    }

    .shoulder div {
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid #26313d;
      background: #131c2b;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }

    .button {
      min-height: 52px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #26313d;
      background: #131c2b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .button span {
      font-size: 10px;
      color: #22d3ee;
    }

    .vibration {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="range"] {
      flex: 1;
      min-width: 140px;
      accent-color: #22d3ee;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #22d3ee;
      color: #04121a;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .row {
        flex-direction: column;
        align-items: center;
      }

      .shoulders {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="top">
    <div class="logo">🎮</div>
    <div>
      <h1>Uni<span>Tools</span> Gamer</h1>
      <div style="color:#94a3b8;font-size:13px;">Testador de controles USB</div>
    </div>
  </div>

  <div class="card">
    <div class="status erro" id="status">
      Conecte o controle USB e pressione qualquer botão.
    </div>

    <div class="info" id="info">
      Nenhum controle detectado.
    </div>

    <div class="error" id="error"></div>

    <div class="gamepad" id="gamepad">
      <div class="shoulders">
        <div class="shoulder">
          <div id="btn4">L1</div>
          <div id="btn6">L2</div>
        </div>

        <div class="shoulder" style="text-align:right;">
          <div id="btn5">R1</div>
          <div id="btn7">R2</div>
        </div>
      </div>

      <div class="row">
        <div class="side">
          <div class="dpad">
            <div class="up" id="btn12">▲</div>
            <div class="left" id="btn14">◀</div>
            <div class="right" id="btn15">▶</div>
            <div class="down" id="btn13">▼</div>
          </div>

          <div class="stick">
            <div class="stick-dot" id="stickLeft"></div>
          </div>
        </div>

        <div class="center">
          <div style="width:70px;height:70px;border-radius:50%;border:1px solid #26313d;background:#131c2b;display:grid;place-items:center;font-size:24px;">
            🎮
          </div>
          UniTools<br>Gamer
        </div>

        <div class="side">
          <div class="face">
            <div class="top" id="btn3">Y</div>
            <div class="left" id="btn2">X</div>
            <div class="bottom" id="btn0">A</div>
            <div class="right" id="btn1">B</div>
          </div>

          <div class="stick">
            <div class="stick-dot" id="stickRight"></div>
          </div>
        </div>
      </div>

      <div class="buttons" id="buttons"></div>

      <div class="vibration">
        <input type="range" id="force" min="0" max="1" step="0.05" value="1">
        <button id="vibrate">Vibrar</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const statusEl = document.getElementById("status");
  const infoEl = document.getElementById("info");
  const errorEl = document.getElementById("error");
  const gamepadEl = document.getElementById("gamepad");
  const buttonsEl = document.getElementById("buttons");
  const forceEl = document.getElementById("force");
  const vibrateButton = document.getElementById("vibrate");
  const stickLeft = document.getElementById("stickLeft");
  const stickRight = document.getElementById("stickRight");

  let currentGamepad = null;
  let buttonsCreated = false;

  function showError(message) {
    errorEl.style.display = "block";
    errorEl.textContent = String(message);
  }

  function clearError() {
    errorEl.style.display = "none";
    errorEl.textContent = "";
  }

  function createButtons(gamepad) {
    buttonsEl.innerHTML = "";

    gamepad.buttons.forEach(function (button, index) {
      const item = document.createElement("div");
      item.className = "button";
      item.id = "listButton" + index;

      const name = document.createElement("div");
      name.textContent = "Botão " + index;

      const value = document.createElement("span");
      value.id = "listValue" + index;
      value.textContent = "0.00";

      item.appendChild(name);
      item.appendChild(value);
      buttonsEl.appendChild(item);
    });

    buttonsCreated = true;
  }

  function update() {
    try {
      const gamepads = navigator.getGamepads();
      let found = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i]) {
          found = gamepads[i];
          break;
        }
      }

      if (!found) {
        currentGamepad = null;
        gamepadEl.style.display = "none";
        statusEl.textContent = "Conecte o controle USB e pressione qualquer botão.";
        statusEl.className = "status erro";
        infoEl.textContent = "Nenhum controle detectado.";
        return;
      }

      if (currentGamepad !== found.index) {
        currentGamepad = found.index;
        buttonsCreated = false;
        gamepadEl.style.display = "block";

        statusEl.textContent = "Controle detectado.";
        statusEl.className = "status ok";

        infoEl.innerHTML =
          "<strong>" + found.id + "</strong><br>" +
          "Botões: " + found.buttons.length +
          " • Eixos: " + found.axes.length +
          " • Vibração: " + (found.vibrationActuator ? "suportada" : "não suportada");
      }

      if (!buttonsCreated) {
        createButtons(found);
      }

      for (let i = 0; i < found.buttons.length; i++) {
        const button = found.buttons[i];
        const visual = document.getElementById("btn" + i);
        const listItem = document.getElementById("listButton" + i);
        const listValue = document.getElementById("listValue" + i);

        const active = button.pressed || button.value > 0.05;

        if (visual) {
          if (active) {
            visual.classList.add("on");
          } else {
            visual.classList.remove("on");
          }
        }

        if (listItem) {
          if (active) {
            listItem.classList.add("on");
          } else {
            listItem.classList.remove("on");
          }
        }

        if (listValue) {
          listValue.textContent = button.value.toFixed(2);
        }
      }

      const leftX = found.axes[0] || 0;
      const leftY = found.axes[1] || 0;
      const rightX = found.axes[2] || 0;
      const rightY = found.axes[3] || 0;

      stickLeft.style.transform =
        "translate(" + (leftX * 22) + "px, " + (leftY * 22) + "px)";

      stickRight.style.transform =
        "translate(" + (rightX * 22) + "px, " + (rightY * 22) + "px)";

    } catch (error) {
      showError("Erro no JavaScript:\n" + error.message);
    }

    requestAnimationFrame(update);
  }

  function vibrate() {
    try {
      const gamepads = navigator.getGamepads();
      let gamepad = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i]) {
          gamepad = gamepads[i];
          break;
        }
      }

      if (!gamepad) {
        statusEl.textContent = "Nenhum controle detectado.";
        statusEl.className = "status erro";
        return;
      }

      const actuator = gamepad.vibrationActuator;

      if (!actuator) {
        statusEl.textContent = "Este controle não expõe vibração ao navegador.";
        statusEl.className = "status erro";
        return;
      }

      const strength = Number(forceEl.value);

      if (typeof actuator.playEffect === "function") {
        actuator.playEffect("dual-rumble", {
          startDelay: 0,
          duration: 500,
          weakMagnitude: strength,
          strongMagnitude: strength
        });

        statusEl.textContent = "Vibração enviada.";
        statusEl.className = "status ok";
        return;
      }

      if (typeof actuator.pulse === "function") {
        actuator.pulse(strength, 500);
        statusEl.textContent = "Vibração enviada pelo modo alternativo.";
        statusEl.className = "status ok";
        return;
      }

      statusEl.textContent = "Este navegador não oferece vibração compatível.";
      statusEl.className = "status erro";

    } catch (error) {
      showError("Erro ao vibrar:\n" + error.message);
    }
  }

  vibrateButton.addEventListener("click", vibrate);

  window.addEventListener("gamepadconnected", function () {
    clearError();
    statusEl.textContent = "Controle conectado.";
    statusEl.className = "status ok";
  });

  window.addEventListener("gamepaddisconnected", function () {
    currentGamepad = null;
    gamepadEl.style.display = "none";
    statusEl.textContent = "Controle desconectado.";
    statusEl.className = "status erro";
  });

  window.addEventListener("error", function (event) {
    showError("Erro na página:\n" + event.message);
  });

  requestAnimationFrame(update);
})();
</script>

</body>
</html>
