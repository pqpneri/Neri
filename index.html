<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Simples de Controle — UniTools Gamer</title>

<style>
  body {
    margin: 0;
    padding: 24px;
    background: #070b12;
    color: #eef2ff;
    font-family: Arial, sans-serif;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 16px;
  }

  .card {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    border-radius: 16px;
    background: #101826;
    border: 1px solid #26313d;
  }

  .status {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .verde { color: #34d399; }
  .vermelho { color: #fb7185; }

  .info {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 18px;
    word-break: break-word;
  }

  .erro {
    display: none;
    margin-bottom: 18px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(251, 113, 133, .15);
    border: 1px solid #fb7185;
    color: #fecdd3;
    font-family: monospace;
    white-space: pre-wrap;
  }

  .botoes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }

  .botao {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #26313d;
    background: #131c2b;
    color: #94a3b8;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
  }

  .ativo {
    background: #22d3ee;
    color: #04121a;
    border-color: #22d3ee;
  }

  .eixos {
    margin-top: 18px;
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<h1>🎮 UniTools Gamer — Teste Simples</h1>

<div class="card">
  <div class="status vermelho" id="status">
    Conecte o controle e pressione qualquer botão.
  </div>

  <div class="info" id="info">
    Nenhum controle detectado.
  </div>

  <div class="erro" id="erro"></div>

  <div class="botoes" id="botoes"></div>

  <div class="eixos" id="eixos">
    Mova os analógicos para ver os valores aqui.
  </div>
</div>

<script>
(function () {
  "use strict";

  const statusEl = document.getElementById("status");
  const infoEl = document.getElementById("info");
  const erroEl = document.getElementById("erro");
  const botoesEl = document.getElementById("botoes");
  const eixosEl = document.getElementById("eixos");

  let controleAtual = null;
  let botoesCriados = false;

  function mostrarErro(mensagem) {
    erroEl.style.display = "block";
    erroEl.textContent = String(mensagem);
  }

  function limparErro() {
    erroEl.style.display = "none";
    erroEl.textContent = "";
  }

  function criarBotoes(quantidade) {
    botoesEl.innerHTML = "";

    for (let i = 0; i < quantidade; i++) {
      const div = document.createElement("div");
      div.className = "botao";
      div.id = "botao" + i;
      div.textContent = "Botão " + i;
      botoesEl.appendChild(div);
    }

    botoesCriados = true;
  }

  function atualizar() {
    try {
      const lista = navigator.getGamepads();
      let controle = null;

      for (let i = 0; i < lista.length; i++) {
        if (lista[i]) {
          controle = lista[i];
          break;
        }
      }

      if (!controle) {
        controleAtual = null;
        botoesCriados = false;
        botoesEl.innerHTML = "";
        eixosEl.textContent = "Mova os analógicos para ver os valores aqui.";

        statusEl.textContent = "Nenhum controle detectado.";
        statusEl.className = "status vermelho";

        infoEl.textContent =
          "O navegador ainda não enxerga nenhum gamepad. " +
          "Pressione um botão com esta página aberta e em foco.";

        requestAnimationFrame(atualizar);
        return;
      }

      if (controleAtual !== controle.index) {
        controleAtual = controle.index;
        botoesCriados = false;

        statusEl.textContent = "Controle detectado.";
        statusEl.className = "status verde";

        infoEl.innerHTML =
          "<strong>" + controle.id + "</strong><br>" +
          "Índice: " + controle.index + "<br>" +
          "Botões: " + controle.buttons.length + "<br>" +
          "Eixos: " + controle.axes.length + "<br>" +
          "Mapeamento: " + (controle.mapping || "não informado") + "<br>" +
          "Vibração: " + (controle.vibrationActuator ? "suportada" : "não suportada");
      }

      if (!botoesCriados) {
        criarBotoes(controle.buttons.length);
      }

      for (let i = 0; i < controle.buttons.length; i++) {
        const botao = controle.buttons[i];
        const elemento = document.getElementById("botao" + i);

        if (!elemento) {
          continue;
        }

        if (botao.pressed || botao.value > 0.05) {
          elemento.classList.add("ativo");
          elemento.textContent = "Botão " + i + " — ATIVO";
        } else {
          elemento.classList.remove("ativo");
          elemento.textContent = "Botão " + i;
        }
      }

      let textoEixos = "";

      for (let i = 0; i < controle.axes.length; i++) {
        textoEixos += "Eixo " + i + ": " + controle.axes[i].toFixed(3) + "\n";
      }

      eixosEl.textContent = textoEixos || "Este controle não informou eixos.";

    } catch (erro) {
      mostrarErro("Erro no site:\n" + erro.message);
    }

    requestAnimationFrame(atualizar);
  }

  window.addEventListener("gamepadconnected", function () {
    limparErro();
    statusEl.textContent = "Controle conectado.";
    statusEl.className = "status verde";
  });

  window.addEventListener("gamepaddisconnected", function () {
    controleAtual = null;
    botoesCriados = false;
    botoesEl.innerHTML = "";

    statusEl.textContent = "Controle desconectado.";
    statusEl.className = "status vermelho";
    infoEl.textContent = "Nenhum controle detectado.";
  });

  window.addEventListener("error", function (evento) {
    mostrarErro("Erro na página:\n" + evento.message);
  });

  requestAnimationFrame(atualizar);
})();
</script>

</body>
</html>
